org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 opt-outs for the DartNative 1.8.0 Gradle plugin, which predates AGP 9.
# newDsl and builtInKotlin match the Flutter 3.50 template. disallowProvider is
# needed because the plugin adds Provider instances to an Android source set.
# AGP 10 removes these opt-outs; bumping past AGP 9 needs a newer plugin.
android.newDsl=false
android.builtInKotlin=false
android.sourceset.disallowProvider=false
