name: flutter_soloud
description: >-
  A low-level audio plugin for Flutter,
  mainly meant for games and immersive apps.
  Based on the SoLoud (C++) and miniaudio
  audio engine.
version: 5.2.2
homepage: https://github.com/alnitak/flutter_soloud
maintainer: Marco Bavagnoli (@alnitak)
platforms:
  android:  
  ios:
  linux:
  macos:
  windows:
  web:
topics:
  - audio
  - player
  - games

screenshots:
  - description: "audio FFT data"
    path: img/screenshot.png

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  code_assets: ^2.0.0
  dartnative: ^1.0.0
  dartnative_path_provider: ^1.0.0
  ffi: ^2.1.4
  hooks: ^2.2.0
  http: ^1.3.0
  logging: ^1.3.0
  meta: ^1.15.0
  native_toolchain_c: ^0.19.4
  path: ^1.9.0
  web: ^1.1.0

dev_dependencies:
  ffigen: ^19.1.0
  test: ^1.24.9
  very_good_analysis: ^6.0.0

funding:
  - https://github.com/sponsors/alnitak
